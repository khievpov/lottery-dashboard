name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::warning::VPS_HOST secret not set — skipping deploy. See README 'Deploy to Hostinger VPS'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "${VPS_USER:-deploy}@$VPS_HOST" 'bash -se' <<'EOF'
            set -euo pipefail
            cd /var/www/lottery-dashboard
            git fetch --quiet origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs
            pm2 save
            sleep 2
            curl -fsS http://127.0.0.1:3000/api/summary
          EOF
